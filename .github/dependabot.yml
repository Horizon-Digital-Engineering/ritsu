version: 2
updates:
  # Compatible updates travel together so they can be reviewed and tested as a
  # set. Every major arrives on its own.
  #
  # Majors used to share one group, which repeated the problem grouping was
  # meant to solve. Two unrelated breaking upgrades landed in a single pull
  # request; one could not resolve at all, because a linter peer range had not
  # caught up with a new compiler, and it held the other hostage. The second
  # was independent and clean and still could not be taken. A blocked upgrade
  # should block only itself, and it can only do that if it arrives alone.
  #
  # An ungrouped update-type gets one pull request per package by default, so
  # there is no "major" group here on purpose.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Raised alongside the split: majors now arrive one per package rather than
    # batched, so the ceiling has to hold more of them or the tail is silently
    # never proposed.
    open-pull-requests-limit: 10
    # Wait a week before proposing a freshly published version — a newly
    # published package can be malicious or unstable; the delay lets bad
    # releases get yanked before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "deps"

  # One batched GitHub Actions PR a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "ci"
