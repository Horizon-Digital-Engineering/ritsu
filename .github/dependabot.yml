version: 2
updates:
  # One batched npm PR a month. A single catch-all group means all version
  # updates (patch/minor/major) land together, not as a trickle of separate
  # PRs — we review + test the group before merging.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Wait a week before proposing a freshly published version — a newly
    # published package can be malicious or unstable; the delay lets bad
    # releases get yanked before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
    labels:
      - "deps"

  # One batched GitHub Actions PR a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "ci"
