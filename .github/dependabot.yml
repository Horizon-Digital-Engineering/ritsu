version: 2
updates:
  # Two batched npm PRs a month at most. Compatible updates travel together so
  # they can be reviewed and tested as a set; a breaking upgrade arrives on its
  # own, because one of them failing a build should not hold back the rest.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Wait a week before proposing a freshly published version — a newly
    # published package can be malicious or unstable; the delay lets bad
    # releases get yanked before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    labels:
      - "deps"

  # One batched GitHub Actions PR a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "ci"
