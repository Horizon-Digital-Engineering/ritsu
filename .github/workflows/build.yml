name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Default token to read-only; the SonarQube job needs nothing else.
permissions:
  contents: read

jobs:
  sonarqube:
    # Dependabot-triggered runs get no repository secrets, so the scan cannot
    # authenticate; a version bump has nothing for Sonar to say anyway.
    if: github.actor != 'dependabot[bot]'
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        # SHA-pinned third-party action. The hex below is a git commit SHA of
        # SonarSource/sonarqube-scan-action that we've reviewed and trust;
        # SHA pinning is the supply-chain control that OSSF Scorecard's
        # `Pinned-Dependencies` check looks for (an unpinned `@v8.1.0` tag
        # can be moved to a malicious commit by an attacker who compromises
        # the action's repo). Semgrep's `detected-sonarqube-docs-api-key`
        # rule pattern-matches the hex shape without context — there's no
        # configuration that lets the rule distinguish "git commit pin" from
        # "leaked credential," so this is the rule's limitation, not ours.
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
