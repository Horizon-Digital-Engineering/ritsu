name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Default token to read-only; the SonarQube job needs nothing else.
permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        # SHA-pinned third-party action. The hex below is a git commit SHA of
        # SonarSource/sonarqube-scan-action that we've reviewed and trust;
        # SHA pinning is the supply-chain control that OSSF Scorecard's
        # `Pinned-Dependencies` check looks for (an unpinned `@v8.1.0` tag
        # can be moved to a malicious commit by an attacker who compromises
        # the action's repo). Semgrep's `detected-sonarqube-docs-api-key`
        # rule pattern-matches the hex shape without context — there's no
        # configuration that lets the rule distinguish "git commit pin" from
        # "leaked credential," so this is the rule's limitation, not ours.
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
