name: SBOM
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)generate + sign SBOMs for'
        required: true
  release:
    types: [published]
  workflow_dispatch:

# Default-deny at the top level so the workflow can't accidentally use
# a write-scoped token outside the one job that needs it. Scorecard's
# Token-Permissions check requires this even when there's only one job.
permissions:
  contents: read

jobs:
  sbom:
    name: Generate + attach SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach SBOM to the release
      id-token: write       # OIDC token for the SLSA attestation
      attestations: write   # write the attestation to the repo
    env:
      # Hoisted out of `run:` interpolation per semgrep's
      # github-actions.security.run-shell-injection rule: github.* context
      # data should land in env first, then be referenced as "$VAR" inside the
      # script so it can't be parsed as shell.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > "ritsu-${REF_NAME}-sbom.cdx.json"

      - name: Generate SPDX SBOM
        run: npm sbom --sbom-format=spdx --sbom-type=application > "ritsu-${REF_NAME}-sbom.spdx.json"

      # SLSA build provenance — a signed statement that "this SBOM file
      # was produced by this workflow at this commit." Anyone consuming
      # ritsu's release artifacts can verify the attestation chain with
      # `gh attestation verify <file> --owner Horizon-Digital-Engineering`.
      # Closes the supply-chain gap where an attacker swaps the SBOM for
      # a stale / lying one.
      - name: Attest SBOM build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.0.0
        with:
          subject-path: 'ritsu-*-sbom.*.json'

      # Copy the attestation bundle (.intoto.jsonl) next to the SBOMs so
      # we can ship it as a release asset. The default attestation path
      # is `${{ steps.attest.outputs.bundle-path }}` (a GH-temp path).
      # Scorecard's Signed-Releases check pattern-matches `.intoto.jsonl`
      # next to release artifacts — uploading the bundle here is what
      # flips its "has provenance" sub-check from 0 to credit.
      - name: Stage attestation bundle as a release asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eo pipefail
          cp "$BUNDLE_PATH" "ritsu-${REF_NAME}-provenance.intoto.jsonl"
          ls -la ritsu-*

      # Sigstore keyless cosign signing. No private key — the signing
      # identity IS this workflow's OIDC token (issuer:
      # https://token.actions.githubusercontent.com, subject:
      # this repo + ref + workflow path). Fulcio mints a 10-min
      # cert tied to that identity; Rekor logs the signing event to
      # the public transparency log. Anyone verifying:
      #   cosign verify-blob \
      #     --certificate-identity-regexp "^https://github.com/Horizon-Digital-Engineering/ritsu/" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --signature <file>.sig --certificate <file>.pem <file>
      # Scorecard's Signed-Releases check pattern-matches on the
      # `.sig` extension next to release assets.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOMs with cosign (keyless)
        run: |
          set -eo pipefail
          for f in ritsu-*-sbom.*.json; do
            cosign sign-blob --yes \
            --new-bundle-format=false \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la ritsu-*-sbom.*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            ritsu-*-sbom.*.json
            ritsu-*-sbom.*.json.sig
            ritsu-*-sbom.*.json.pem
            ritsu-*-provenance.intoto.jsonl

      - name: Attach SBOMs + signatures + provenance to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$REF_NAME" \
            ritsu-*-sbom.*.json \
            ritsu-*-sbom.*.json.sig \
            ritsu-*-sbom.*.json.pem \
            ritsu-*-provenance.intoto.jsonl \
            --clobber
