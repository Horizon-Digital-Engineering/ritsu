name: SBOM
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the SBOM to the release

jobs:
  sbom:
    name: Generate + attach SBOM
    runs-on: ubuntu-latest
    env:
      # Hoisted out of `run:` interpolation per semgrep's
      # github-actions.security.run-shell-injection rule: github.* context
      # data should land in env first, then be referenced as "$VAR" inside the
      # script so it can't be parsed as shell.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > "ritsu-${REF_NAME}-sbom.cdx.json"

      - name: Generate SPDX SBOM
        run: npm sbom --sbom-format=spdx --sbom-type=application > "ritsu-${REF_NAME}-sbom.spdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ritsu-*-sbom.*.json

      - name: Attach SBOMs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$REF_NAME" ritsu-*-sbom.*.json --clobber
