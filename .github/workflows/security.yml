name: Security
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly Sunday 06:00 UTC — catches new advisories in deps that haven't changed.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install actionlint
        run: |
          set -eo pipefail
          VERSION=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint -version
      - run: actionlint -color

  secrets-trufflehog:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # trufflehog needs full history for diff scanning
      - name: trufflehog
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --only-verified

  secrets-gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -eo pipefail
          VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks detect
        run: |
          set -eo pipefail
          echo "## Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          if gitleaks detect --source . --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif; then
            echo "OK no secrets found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL gitleaks found leaks (see job log; sarif uploaded as artifact)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  npm-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (fail on high+)
        run: |
          set -eo pipefail
          {
            echo "## Dependency audit"
            if npm audit --audit-level=high 2>&1 | tee audit.txt; then
              echo "OK no high/critical vulnerabilities"
              ok=1
            else
              echo "FAIL vulnerabilities found:"
              echo '```'
              cat audit.txt
              echo '```'
              ok=0
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${ok:-0}" = "1" ] || exit 1
      - name: npm audit signatures (supply-chain integrity)
        # Verifies every installed package's tarball matches a Sigstore /
        # registry signature. Catches a compromised registry mirror or a
        # tarball that was modified between publish and install. Returns
        # missing-signature warnings as well — most legacy packages aren't
        # signed yet; we fail only when an actively-bad signature is
        # detected, not on missing signatures.
        run: |
          set -eo pipefail
          warned=0
          {
            echo "## Dependency signatures"
            if npm audit signatures 2>&1 | tee signatures.txt; then
              echo "OK signatures verified"
            else
              # Some packages are unsigned (not bad signatures) — surface the
              # output but don't fail until npm-audit-signatures matures.
              echo "WARN signature audit reported issues (see log):"
              echo '```'
              cat signatures.txt
              echo '```'
              warned=1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$warned" = "1" ] && echo "::warning::npm audit signatures reported issues — review the log"
          true

  scorecard:
    name: OpenSSF Scorecard
    # Skipped on PR runs — Scorecard analyzes the default branch's
    # supply-chain posture, not per-PR diffs, so running on PRs just
    # burns minutes on irrelevant scans.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code-scanning
      id-token: write          # publish results to scorecard.dev (powers the badge)
      contents: read
      actions: read
      # Branch-Protection would need a PAT (not GITHUB_TOKEN) to query
      # branch-protection settings. Scorecard reports -1 (inconclusive)
      # for that check without one. -1 is skipped from the overall
      # average — it doesn't hurt the score, just doesn't help.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: results.sarif

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned to a numbered tag — semgrep:latest changes daily and rules
      # change with it. Bump deliberately when investigating new findings.
      image: semgrep/semgrep:1.163.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: semgrep scan
        run: |
          set -eo pipefail
          echo "## Semgrep SAST" >> "$GITHUB_STEP_SUMMARY"
          if semgrep scan --config auto --error --exclude node_modules --exclude dist 2>&1 | tee semgrep.txt; then
            echo "OK no findings" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "FAIL findings:"
              echo '```'
              cat semgrep.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
