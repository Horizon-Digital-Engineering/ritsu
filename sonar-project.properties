sonar.projectKey=Horizon-Digital-Engineering_ritsu
sonar.organization=horizon-digital-engineering

# Sources to analyze. Declaring tests via sonar.tests (rather than excluding
# them) lets SonarCloud apply test-quality rules (no-assert, duplicate name,
# etc.) while still keeping product-code rules off the test files.
sonar.sources=src
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/__tests__/**
sonar.test.exclusions=**/node_modules/**,**/dist/**

# Exclude SQL files from PL/SQL analysis (we use SQLite via node:sqlite, not Oracle PL/SQL)
sonar.plsql.file.suffixes=.pks,.pkb

# TypeScript/JavaScript coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
