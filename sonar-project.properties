sonar.projectKey=Horizon-Digital-Engineering_ritsu
sonar.organization=horizon-digital-engineering

# Sources to analyze. Tests are excluded entirely — the test-rule subset
# in this SonarCloud project's quality profile fires production-code
# rules (S2871, S5443, etc.) on test fixtures, treating /tmp paths and
# unordered .sort() calls as findings even where they're correct for
# the test. Pure exclusion is the cleaner posture.
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/__tests__/**,**/*.test.ts

# Exclude SQL files from PL/SQL analysis (we use SQLite via node:sqlite, not Oracle PL/SQL)
sonar.plsql.file.suffixes=.pks,.pkb

# TypeScript/JavaScript coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclude the admin browser bundle from COVERAGE only (still analyzed for bugs/
# smells). app.js is DOM/browser code — it can't be unit-covered under node, so
# c8 already excludes it (see the test:coverage script) and it's verified in a
# real browser instead. Without this it counts as uncovered "new code" and sinks
# the new-code coverage gate.
sonar.coverage.exclusions=src/admin/app.js
