<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f1115" />
  <title>ritsu</title>
  <!-- app.css first: plugin UIs are written against Studio's component classes. -->
  <link rel="stylesheet" href="/admin/app.css" />
  <link rel="stylesheet" href="/admin/apps.css" />
</head>
<body>
  <!-- Handlers are wired by delegated listeners in apps.js via data-action /
       data-change, so no inline onclick= or style= appears here. -->
  <nav class="rail" aria-label="Areas">
    <a class="rail-logo" href="/admin/workspace" title="ritsu">r</a>
    <a class="rail-btn" href="/admin/workspace" title="Workspace — talk to agents" aria-label="Workspace">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </a>
    <a class="rail-btn" href="/admin/ops" title="Operations — approvals, jobs, health, logs" aria-label="Operations">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/></svg>
      <span id="rail-ops-badge" class="rail-badge hidden">0</span>
    </a>
    <a class="rail-btn" href="/admin" title="Studio — agents &amp; configuration" aria-label="Studio">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </a>
  </nav>

  <header>
    <a class="rail-logo app-home only-mobile" href="/admin/workspace" title="ritsu">r</a>
    <h1><span id="app-name">…</span> <small id="app-desc"></small></h1>
    <span class="info" id="app-actions"></span>
  </header>
  <nav class="tabs primary app-tabs" id="app-tabs" aria-label="App sections"></nav>

  <main id="app-main">
    <section id="app-empty" class="pane active"><p class="muted">Loading…</p></section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="admin-login" class="modal-fullpage">
    <form id="admin-login-form" autocomplete="on" class="admin-login-card">
      <h2 class="admin-login-title">ritsu</h2>
      <p id="admin-login-msg" class="admin-login-msg">Sign in with your admin token.</p>
      <input id="admin-login-user" type="text" name="username" autocomplete="username" value="ritsu"
             readonly tabindex="-1" class="hidden" aria-label="Username" aria-hidden="true">
      <label for="admin-login-token" class="admin-login-label">Admin token</label>
      <input id="admin-login-token" name="password" type="password" autocomplete="current-password"
             placeholder="rt_…" required spellcheck="false" class="admin-login-input">
      <button type="submit" class="admin-login-btn">Sign in</button>
    </form>
  </div>

<script src="/admin/rail.js"></script>
<script src="/admin/apps.js" type="module"></script>
</body>
</html>
