<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ritsu</title>
<link rel="stylesheet" href="/admin/workspace.css">
</head>
<body>
  <!-- Every handler is wired by the delegated listeners in workspace.js via
       data-action / data-change, so no inline onclick= or style= survives
       here — that is what lets the CSP keep script-src/style-src at 'self'. -->
  <div class="shell">
    <header class="topbar">
      <button type="button" class="icon-btn only-mobile" data-action="toggle-sidebar" aria-label="Toggle sidebar" aria-expanded="false">☰</button>
      <div class="switcher">
        <button type="button" id="agent-btn" class="agent-btn" data-action="toggle-agent-menu" aria-haspopup="menu" aria-expanded="false">
          <span id="agent-btn-glyph" aria-hidden="true"></span>
          <span id="agent-btn-label" class="agent-name">loading…</span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div id="agent-menu" class="agent-menu" role="menu" aria-hidden="true"></div>
      </div>
      <span class="flex1"></span>
      <a class="topbar-link" href="/admin" title="Classic admin">admin ⚙</a>
    </header>

    <div id="scrim" class="scrim" data-action="close-sidebar"></div>

    <aside id="sidebar" class="sidebar">
      <div class="side-top">
        <button type="button" class="new-chat" data-action="new-chat">+ New chat</button>
        <label class="search-wrap">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="side-search" type="search" placeholder="Search chats and projects"
                 aria-label="Search chats and projects" autocomplete="off" spellcheck="false">
        </label>
      </div>

      <nav class="side-scroll" aria-label="Workspace">
        <div class="side-section">
          <div id="side-default" class="side-list"></div>
        </div>
        <div class="side-section">
          <div class="side-head">
            <span>Projects</span>
            <button type="button" class="side-head-btn" data-action="new-project" title="New project" aria-label="New project">+</button>
          </div>
          <div id="side-projects" class="side-list"></div>
        </div>
        <div class="side-section">
          <div class="side-head"><span>Chats</span></div>
          <div id="side-chats" class="side-list"></div>
        </div>
      </nav>

      <div class="side-foot">
        <button type="button" id="files-nav" class="side-item files-nav" data-action="open-files">
          <span class="side-item-lead" aria-hidden="true">📁</span>
          <span class="side-item-title">Files</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <!-- ============ CHAT ============ -->
      <section id="view-chat" class="view" aria-label="Chat">
        <div class="view-head">
          <div class="view-title-wrap">
            <h1 id="chat-title" class="view-title">…</h1>
            <div id="chat-sub" class="view-sub"></div>
          </div>
          <label id="chat-file-wrap" class="file-under hidden">
            <span class="file-under-label">File under</span>
            <select id="chat-project" data-change="file-chat" aria-label="File this chat under a project"></select>
          </label>
        </div>

        <div id="transcript" class="transcript" aria-live="polite"></div>

        <form id="ask-form" class="composer">
          <div id="attach-tray" class="attach-tray" aria-hidden="true"></div>
          <div id="attach-hint" class="attach-hint" aria-hidden="true"></div>
          <!-- Placeholder stays short: a textarea does not autosize to wrapped
               placeholder text, so a long one clips on a phone. -->
          <textarea id="ask-input" rows="1" aria-label="Message this agent" placeholder="Message…"
                    title="Enter to send, Shift+Enter for a newline, paste an image to attach"></textarea>
          <div class="composer-row">
            <button type="button" class="icon-btn" data-action="pick-attachment" title="Attach image" aria-label="Attach image">📎</button>
            <input type="file" id="ask-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden aria-label="Attach an image">
            <span class="flex1"></span>
            <button type="submit" id="ask-send" class="primary send-btn" title="Send" aria-label="Send">→</button>
          </div>
        </form>
      </section>

      <!-- ============ PROJECT ============ -->
      <section id="view-project" class="view" aria-label="Project"></section>

      <!-- ============ FILES ============ -->
      <section id="view-files" class="view" aria-label="Files"></section>
    </main>
  </div>

  <input type="file" id="upload-file" multiple hidden aria-label="Upload files to this workspace">

  <output id="toast" class="toast hidden"></output>

  <!-- A real <form> with a password input + hidden username so password
       managers recognize it as a saveable login and offer autofill. -->
  <div id="admin-login" class="modal-fullpage">
    <form id="admin-login-form" autocomplete="on" class="admin-login-card">
      <h2 class="admin-login-title">ritsu</h2>
      <p id="admin-login-msg" class="admin-login-msg">Sign in with your admin token.</p>
      <input id="admin-login-user" type="text" name="username" autocomplete="username" value="ritsu"
             readonly tabindex="-1" aria-label="Username" class="hidden">
      <label for="admin-login-token" class="admin-login-label">Admin token</label>
      <input id="admin-login-token" name="password" type="password" autocomplete="current-password"
             placeholder="rt_…" required spellcheck="false" class="admin-login-input">
      <button class="primary" type="submit">Sign in</button>
    </form>
  </div>

  <script src="/admin/workspace.js" type="module"></script>
</body>
</html>
